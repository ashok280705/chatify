version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: chatify
    volumes:
      - mongo_data:/data/db
    networks:
      - chatify-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  chatify:
    image: ashok28072005/chatify:latest
    container_name: chatify
    depends_on:
      - mongodb
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - chatify-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:

networks:
  chatify-net:
